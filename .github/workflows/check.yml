name: Skill checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create isolated test environment
        run: python3 -m venv .venv
      - name: Install the tested image dependency
        run: .venv/bin/python -m pip install -r skills/torn-paper/scripts/requirements.txt
      - name: Run security and distribution regressions
        run: .venv/bin/python -m unittest discover -s tests -v

